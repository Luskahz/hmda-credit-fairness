[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmda-credit-fairness"
version = "0.1.0"
description = "Reproducible HMDA mortgage approval and fairness research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "pyarrow>=17,<24",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyterlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
